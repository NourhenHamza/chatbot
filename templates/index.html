<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Base de Données</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Chatbot Base de Données</h1>
            <div class="db-selector">
                <label for="dbType">Type de base de données:</label>
                <select id="dbType">
                    <option value="mysql">MySQL</option>
                    <option value="postgresql">PostgreSQL</option>
                    <option value="mongodb">MongoDB</option>
                </select>
            </div>
        </header>

        <div class="main-content">
            <div class="sidebar">
                <div class="db-info">
                    <h3>Informations de la base de données</h3>
                    <div class="db-details">
                        <p><strong>Type:</strong> <span id="currentDbType">MySQL</span></p>
                        <p><strong>Base de données:</strong> <span id="currentDbName">-</span></p>
                    </div>
                    <div class="tables-section">
                        <h4>Tables/Collections:</h4>
                        <ul id="tablesList">
                            <li>Chargement...</li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <div class="message bot-message">
                        <div class="message-content">
                            Bonjour ! Je suis votre assistant pour interroger la base de données. Posez-moi vos questions !
                        </div>
                    </div>
                </div>
                
                <div class="chat-input">
                    <div class="input-group">
                        <input type="text" id="messageInput" placeholder="Tapez votre question ici..." autocomplete="off">
                        <button id="sendButton">Envoyer</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
